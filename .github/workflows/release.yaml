name: Release WiringPi (ARMv7 + ARM64)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:bookworm

    strategy:
      matrix:
        # label = release asset name, debarch = dpkg architecture.
        # armv7 builds with the armhf toolchain (ARMv7 baseline): Pi 2-5, Zero 2.
        # ARMv6 Pi 1/Zero are built manually and uploaded separately - see #448/#450.
        include:
          - label: arm64
            debarch: arm64
          - label: armv7
            debarch: armhf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain & packaging tools
        run: |
          dpkg --add-architecture armhf
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            build-essential \
            crossbuild-essential-armhf \
            crossbuild-essential-arm64 \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            pkg-config \
            fakeroot \
            dpkg-dev \
            gettext \
            libcrypt-dev:${{ matrix.debarch }} \
            libcrypt1:${{ matrix.debarch }}

      - name: Build WiringPi (${{ matrix.label }})
        run: |
          if [ "${{ matrix.debarch }}" = "armhf" ]; then
            export CC=arm-linux-gnueabihf-gcc
            export AR=arm-linux-gnueabihf-ar
            export STRIP=arm-linux-gnueabihf-strip
          else
            export CC=aarch64-linux-gnu-gcc
            export AR=aarch64-linux-gnu-ar
            export STRIP=aarch64-linux-gnu-strip
          fi

          vMaj=$(cut -d. -f1 VERSION)
          vMin=$(cut -d. -f2 VERSION)
          export VERSION="$vMaj.$vMin"
          export ARCH="${{ matrix.debarch }}"

          here=$(pwd)
          deb_destdir="${here}/debian-template/wiringPi-${{ matrix.label }}"
          rm -rf "${deb_destdir}"
          mkdir -p "${deb_destdir}/DEBIAN"
          cp -v ${here}/debian-template/wiringPi/control_template "${deb_destdir}/"
          cp -v ${here}/debian-template/wiringPi/DEBIAN/postinst "${deb_destdir}/DEBIAN/"
          cp -v ${here}/debian-template/wiringPi/DEBIAN/postrm "${deb_destdir}/DEBIAN/"
          cd "${deb_destdir}"
          envsubst < control_template > DEBIAN/control
          rm -f control_template
          rm -rf usr

          cd "$here/wiringPi"
          make install-deb V=1 \
            DEB_DESTDIR="${deb_destdir}"

          cd "$here/devLib"
          make install-deb V=1 \
            INCLUDE='-I. -I../wiringPi' \
            DEB_DESTDIR="${deb_destdir}"

          cd "$here/gpio"
          make install-deb V=1 \
            INCLUDE='-I../wiringPi -I../devLib' \
            LDFLAGS='' \
            LIBS="../wiringPi/*.o ../devLib/*.o -lpthread -lrt -lm -lcrypt" \
            DEB_DESTDIR="${deb_destdir}"

          cd "$here/debian-template"
          fakeroot dpkg-deb --build wiringPi-${{ matrix.label }}
          dpkg-name -o wiringPi-${{ matrix.label }}.deb
          # dpkg-name uses the dpkg arch (armhf); give the asset the distinct
          # armv7 name so it is not confused with the manual ARMv6 armhf build.
          if [ "${{ matrix.label }}" != "${{ matrix.debarch }}" ]; then
            for f in wiringpi_*_${{ matrix.debarch }}.deb; do
              mv "$f" "${f%_${{ matrix.debarch }}.deb}_${{ matrix.label }}.deb"
            done
          fi
          ls -R

      - name: Generate SHA256 checksum
        run: |
          cd debian-template
          ls -R
          debfile=$(ls -1 wiringpi_*_${{ matrix.label }}.deb | head -n 1)
          echo "file: $debfile"
          sha256sum "$debfile" > "SHA256SUMS-${{ matrix.label }}"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            debian-template/wiringpi_*_${{ matrix.label }}.deb
            debian-template/SHA256SUMS-${{ matrix.label }}
