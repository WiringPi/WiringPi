name: Build ARM64 (Bookworm + Debian Package)

on:
  push:
    branches:
      - crossbuild
  pull_request:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    container:
      image: debian:bookworm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM64 toolchain & packaging tools
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            crossbuild-essential-arm64 \
            pkg-config \
            fakeroot \
            dpkg-dev \
            gettext \
            libcrypt-dev:arm64 \
            libcrypt1:arm64

      - name: Build wiringPi (ARM64)
        run: |
          export CC=aarch64-linux-gnu-gcc
          export AR=aarch64-linux-gnu-ar
          export STRIP=aarch64-linux-gnu-strip
          export CFLAGS="-v"
          export LDFLAGS="-v"

          echo "=== COMPILER SEARCH DIRS ==="
          $CC -print-search-dirs

          echo "Building wiringPi..."
          cd wiringPi
          make -j$(nproc) V=1

          echo "Building devLib..."
          cd ../devLib
          make -j$(nproc) V=1 \
            INCLUDE='-I. -I../wiringPi' \
            LDFLAGS='-L../debian-template/wiringPi/usr/lib'

          echo "Building gpio..."
          cd ../gpio
          make -j$(nproc) V=1 \
            INCLUDE='-I. -I../wiringPi -I../devLib' \
            LDFLAGS='-L../debian-template/wiringPi/usr/lib' \
            LIBS='../wiringPi/*.o ../devLib/*.o -lpthread -lrt -lm -lcrypt'

      - name: Build Debian package
        run: |
          export CC=aarch64-linux-gnu-gcc
          export AR=aarch64-linux-gnu-ar
          export STRIP=aarch64-linux-gnu-strip

          vMaj=$(cut -d. -f1 VERSION)
          vMin=$(cut -d. -f2 VERSION)
          export VERSION="$vMaj.$vMin"
          export ARCH="arm64"

          here=$(pwd)
          deb_destdir="${here}/debian-template/wiringPi"

          echo "VERSION=$VERSION"
          echo "ARCH=$ARCH"

          cd debian-template/wiringPi
          envsubst < control_template > DEBIAN/control
          rm -rf usr

          cd "$here/wiringPi"
          make install-deb DEB_DESTDIR="${deb_destdir}"

          cd "$here/devLib"
          make install-deb INCLUDE='-I. -I../wiringPi' DEB_DESTDIR="${deb_destdir}"

          cd "$here/gpio"
          make install-deb INCLUDE='-I../wiringPi -I../devLib' \
            LDFLAGS=-L../debian-template/wiringPi/usr/lib \
            DEB_DESTDIR="${deb_destdir}"

          cd "$here/debian-template"
          fakeroot dpkg-deb --build wiringPi
          dpkg-name -o wiringPi.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: wiringPi-arm64-deb
          path: debian-template/*.deb
          
      - name: Generate SHA256 checksum
        run: |
          cd debian-template
          sha256sum *.deb > SHA256SUMS-arm64

      - name: Upload SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: wiringPi-arm64-sha256
          path: debian-template/SHA256SUMS-arm64
          
